modLoader="javafml"
loaderVersion="[4,)"
license="${license}"

[[mods]]
modId="${modIdKey}"
version="${version}"
displayName="${modName}"
authors="${authors}"
description="${description}"

[[mixins]]
config="tokimiboatyard.neoforge.mixins.json"

[[dependencies.${modIdKey}]]
modId="neoforge"
type="required"
versionRange="[${neoforge},)"
ordering="NONE"
side="BOTH"

[[dependencies.${modIdKey}]]
modId="minecraft"
type="required"
versionRange="${mc}"
ordering="NONE"
side="BOTH"

[[dependencies.${modIdKey}]]
modId="jei"
type="optional"
versionRange="[${jei},)"
ordering="AFTER"
side="BOTH"
