# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.caching=false

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Skip Loom's Mercury source-remap of dep sources jars. Prevents Windows
# AccessDeniedException from racing VS Code's Java LSP over zipfs handles on
# fabric-api sub-module *-sources.jar files.
systemProp.fabric.loom.ci=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.17.2
loom_version=1.11-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=net.cozystudios.tokimiboatyard
archives_base_name=tokimiboatyard

# Dependencies
fabric_version=0.92.6+1.20.1
